[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cesvu"
version = "0.1.0"
description = "cesvu CLI — encrypt/decrypt .cesvu v1 files (zero-knowledge, libsodium-backed)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
# Apache-2.0 covers the wheel via the bundled src/cesvu/LICENSE.txt copy,
# and the sdist via the same copy plus the auto-included top-level LICENSE
# produced by setuptools from the egg-info manifest. We deliberately do
# NOT use the parent-directory ``../../LICENSE`` form here because some
# setuptools versions don't follow ``..`` out of the package root when
# resolving glob patterns, and that creates a noisy wheel-build warning.
license-files = [
    "src/cesvu/LICENSE.txt",
    "src/cesvu/NOTICE.txt",
    "src/cesvu/licenses/*.txt",
]

authors = [{ name = "Gigperfect LLC" }]
dependencies = [
    "pynacl>=1.5.0",
    "tqdm>=4.66.0",
]

[project.scripts]
cesvu = "cesvu.cli:main"
cesvu-licenses = "cesvu.licenses:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cesvu = [
    "wordlists/*.json",
    "NOTICE.txt",
    "LICENSE.txt",
    "TRADEMARKS.txt",
    "licenses/*.txt",
]
